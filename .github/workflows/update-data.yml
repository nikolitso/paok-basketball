name: Update stats

on:
  schedule:
    # once a day at 23:59 Greek time. GitHub cron runs in UTC, so both slots are listed
    # and the "Greek time check" step below lets only the one matching 23:59 in Athens go ahead.
    - cron: "59 20 * * *"   # 23:59 in Greek summer time (UTC+3)
    - cron: "59 21 * * *"   # 23:59 in Greek winter time (UTC+2)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  greek-time:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.when.outputs.go }}
    steps:
      - name: Is it 23:59 in Greece for this slot?
        id: when
        run: |
          offset=$(TZ=Europe/Athens date +%z)
          slot="${{ github.event.schedule }}"
          if [ -z "$slot" ] || { [ "$slot" = "59 20 * * *" ] && [ "$offset" = "+0300" ]; } || { [ "$slot" = "59 21 * * *" ] && [ "$offset" = "+0200" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 23:59 in Greece for this slot (Athens offset $offset), skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: greek-time
    if: needs.greek-time.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Excel reader (play-by-play sheets for plus/minus)
        run: pip install openpyxl
      - name: EuroCup
        run: python scripts/update_eurocup.py
      - name: Greek League (ESAKE)
        run: python scripts/update_gbl.py
      - name: League-wide team stats and averages
        run: python scripts/league.py
      - name: Power ratings and season projections
        run: python scripts/power.py
      - name: Next-game scouting and projections
        run: python scripts/scout.py
      - name: Player photos and profiles (paokbc.gr)
        run: python scripts/update_paokbc.py || echo "paokbc.gr unavailable, keeping previous data"
      - name: Commit if anything changed
        run: |
          git add -A data
          # ignore the "updated" timestamp so we only commit real changes
          if git diff --cached --quiet -I '"updated"'; then
            echo "No new data"; exit 0
          fi
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stats $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
